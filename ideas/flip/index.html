<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    h1 {
      font-size: 1rem;
      font-weight: 400;
      color: #666;
      margin-bottom: 3rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .stage {
      display: none;
    }

    .stage.active {
      display: block;
    }

    /* Stage 1: Input */
    .options {
      margin-bottom: 2rem;
    }

    .options input {
      display: block;
      width: 100%;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 1.125rem;
      border: 1px solid #333;
      background: transparent;
      color: #fff;
      text-align: center;
    }

    .options input::placeholder {
      color: #555;
    }

    .options input:focus {
      outline: none;
      border-color: #666;
    }

    button {
      padding: 1rem 3rem;
      font-size: 1rem;
      background: #fff;
      color: #111;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    button:hover {
      background: #ddd;
    }

    /* Stage 2: Result */
    .result-text {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .result {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 3rem;
      line-height: 1.4;
    }

    .question {
      font-size: 1.25rem;
      color: #999;
      margin-bottom: 2rem;
    }

    .feelings {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feelings button {
      background: transparent;
      color: #fff;
      border: 1px solid #444;
    }

    .feelings button:hover {
      border-color: #fff;
    }

    /* Stage 3: Truth */
    .truth {
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .truth strong {
      color: #4ecdc4;
    }

    .restart {
      margin-top: 2rem;
      background: transparent;
      color: #666;
      border: 1px solid #333;
    }

    .insight {
      font-size: 0.875rem;
      color: #555;
      margin-top: 2rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Flip</h1>

    <!-- Stage 1: Enter options -->
    <div class="stage active" id="stage1">
      <div class="options">
        <input type="text" id="option1" placeholder="Option A">
        <input type="text" id="option2" placeholder="Option B">
      </div>
      <button onclick="flip()">Flip</button>
    </div>

    <!-- Stage 2: Show result, ask feeling -->
    <div class="stage" id="stage2">
      <div class="result-text">The coin says:</div>
      <div class="result" id="result"></div>
      <div class="question">How do you feel about that?</div>
      <div class="feelings">
        <button onclick="reveal('relieved')">Relieved</button>
        <button onclick="reveal('disappointed')">Disappointed</button>
      </div>
    </div>

    <!-- Stage 3: The truth -->
    <div class="stage" id="stage3">
      <div class="truth" id="truth"></div>
      <div class="insight">The coin didn't decide. It revealed.</div>
      <button class="restart" onclick="restart()">Flip again</button>
    </div>
  </div>

  <script>
    let chosenOption = '';
    let otherOption = '';

    function flip() {
      const opt1 = document.getElementById('option1').value.trim() || 'Option A';
      const opt2 = document.getElementById('option2').value.trim() || 'Option B';

      // Random choice
      if (Math.random() < 0.5) {
        chosenOption = opt1;
        otherOption = opt2;
      } else {
        chosenOption = opt2;
        otherOption = opt1;
      }

      document.getElementById('result').textContent = chosenOption;

      // Switch stages
      document.getElementById('stage1').classList.remove('active');
      document.getElementById('stage2').classList.add('active');
    }

    function reveal(feeling) {
      let message = '';

      if (feeling === 'relieved') {
        message = `You wanted <strong>${chosenOption}</strong>.<br>You just needed permission.`;
      } else {
        message = `You wanted <strong>${otherOption}</strong>.<br>Now you know.`;
      }

      document.getElementById('truth').innerHTML = message;

      // Switch stages
      document.getElementById('stage2').classList.remove('active');
      document.getElementById('stage3').classList.add('active');
    }

    function restart() {
      document.getElementById('option1').value = '';
      document.getElementById('option2').value = '';
      document.getElementById('stage3').classList.remove('active');
      document.getElementById('stage1').classList.add('active');
    }
  </script>
</body>
</html>
